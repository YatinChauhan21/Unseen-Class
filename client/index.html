<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Unseen Class</title>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }

      #initial-loader img {
        width: 180px;
        max-width: 55vw;
        height: auto;
        animation: logoPulse 1.5s ease-in-out infinite;
      }

      .loader-dots {
        display: flex;
        gap: 7px;
        margin-top: 25px;
      }

      .loader-dots span {
        width: 8px;
        height: 8px;
        background: #333;
        border-radius: 50%;
        animation: dotBounce 1.2s infinite ease-in-out;
      }

      .loader-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .loader-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes logoPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }

        50% {
          transform: scale(1.04);
          opacity: 0.8;
        }
      }

      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: scale(0.6);
          opacity: 0.4;
        }

        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <img src="/logo.png" alt="Unseen Class" />

      <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener("load", function () {
        const loader = document.getElementById("initial-loader");

        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.3s ease";

          setTimeout(() => {
            loader.remove();
          }, 300);
        }
      });
    </script>
  </body>
</html>
